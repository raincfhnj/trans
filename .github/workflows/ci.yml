name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Lets the lint action annotate the offending lines in a pull request.
  checks: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      # The linter is not a stand-in for the standard check: `go vet` is what a
      # reader runs by hand, and golangci-lint's own copy of it is configured
      # with a site-scoped exception. The one package it cannot check strictly
      # is internal/win32, where a Windows call hands an address back as a
      # uintptr; unsafeptr is turned off for that package alone, with the
      # invariant written at the two conversion sites.
      - name: Vet
        run: |
          go vet $(go list ./... | grep -v 'trans/internal/win32$')
          go vet -unsafeptr=false ./internal/win32/

      # Everything outside the windows files has to build without them.
      - name: Build for linux
        run: GOOS=linux go build ./...

      # The panel and the daemon are Windows programs, and their files are
      # compiled nowhere else on this job: the linter and the tests here run
      # as linux, so this cross-build is their guard.
      - name: Cross-build for windows
        run: GOOS=windows go build ./...

      - name: Test
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # The strict run is in the linux job, where the shell can name the one
      # package that needs unsafeptr turned off; here the whole tree is checked
      # with that single analyzer disabled, which is the same set of checks on
      # the platform the program is written for.
      - name: Vet
        run: go vet -unsafeptr=false ./...

      # No -race here: the detector needs cgo and therefore gcc, which the
      # windows images do not promise; the race suite runs in the linux job.
      # This is the plain run on the system the program is written for — the
      # tests that need a desktop skip themselves when the session has none.
      - name: Test
        run: go test ./...
