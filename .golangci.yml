version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        # Naming is enough; comments are reserved for what code cannot say.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # Win32 hands pointers back as numbers, and there is no way to read what
      # they point at without unsafe.
      - path: internal/win32/
        linters:
          - gosec
          - govet
        text: unsafe|G103
      # Windows hands back fixed-width integers; the ranges belong to the API,
      # and every value here comes from Windows itself.
      - path: internal/win32/
        linters:
          - gosec
        text: G115
      # The log lives in the plugin's own cache directory, under a name the
      # plugin itself chooses.
      - path: internal/winlog/
        linters:
          - gosec
        text: G304
      # The directories come from the author's own configuration, and the files
      # written there are the plugin's own starter settings.
      - path: cmd/trans-window/main\.go
        linters:
          - gosec
        text: G703
      # The service options are built once by the composition root and handed
      # to each provider whole: the documented Provider interface takes them by
      # value, and a pointer would put a nil into every implementation to save
      # one copy of eighty bytes.
      - path: internal/(translation|command|deepl|google|gtranslate|mymemory|openai)/
        linters:
          - gocritic
        text: hugeParam
      # Bubble Tea's interface takes and returns models by value.
      - path: internal/(overlay|vimarea)/
        linters:
          - gocritic
        text: hugeParam
      # Variable names, not secrets; and the paths read are the plugin's own.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: G101|G304
      # Shelling out to the herdr CLI with our own arguments is the whole job.
      - path: internal/herdr/execrunner\.go
        linters:
          - gosec
        text: G204

formatters:
  # Only goimports runs here, because with a module named "trans" the two can
  # never agree: gofumpt reads "trans/internal/…" as standard library — the
  # first path segment has no dot — and pulls it into the std import group,
  # while goimports keeps it in a group of its own as configured below.
  # Whichever ran first would be undone by the other.
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - trans
