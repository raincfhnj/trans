version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        # Naming is enough; comments are reserved for what code cannot say.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # Win32 hands pointers back as numbers, and there is no way to read what
      # they point at without unsafe. The two places that turn one into a
      # pointer say so themselves with a site-scoped nolint, so this rule no
      # longer has to excuse the whole package from govet: a longer-lived
      # suppression than the problem needs is how a real finding hides.
      - path: internal/(win32|tray)/
        linters:
          - gosec
        text: unsafe|G103
      # Bubble Tea's interface takes and returns models by value, and the two
      # small windows keep their whole Options — settings and all — beside the
      # model, which copies on every message anyway.
      - path: internal/(overlay|vimarea|selection|settings)/
        linters:
          - gocritic
        text: hugeParam
      # Variable names, not secrets; and the paths read are the plugin's own —
      # the .env in the config directory, which Save also rewrites in place.
      - path: internal/config/(config|save)\.go
        linters:
          - gosec
        text: G101|G304
      # The Provider interface builds translators with New(options Options): the
      # options are taken by value by design, so the implementations cannot
      # switch to a pointer without changing the interface itself.
      - path: internal/(command|deepl|google|gtranslate|mymemory|openai)/provider\.go
        linters:
          - gocritic
        text: hugeParam
      # The test double implements that same interface, so it takes the options
      # by value for the same reason.
      - path: internal/translation/registry_test\.go
        linters:
          - gocritic
        text: hugeParam
      # These conversions are the widths of the Win32 API itself: window
      # coordinates are int32 and may legitimately be negative on a
      # multi-monitor setup — clamping would be wrong — while thread ids and
      # pointer-sized handles are uint32/uintptr.
      - path: internal/(win32|tray)/
        linters:
          - gosec
        text: G115
      # The paths stat'ed, created and written come from os.UserConfigDir(),
      # os.UserCacheDir() and the TRANS_CONFIG_DIR the user set for themselves:
      # the same user's own environment, not input from anyone else. The panel
      # still carries the same exclusion, where the directories used to be.
      - path: (cmd/trans-window/main|internal/config/prepare)\.go
        linters:
          - gosec
        text: G703
      # The same for the log file: the directory is os.UserCacheDir()/trans and
      # the program name is this program's own, never outside input.
      - path: internal/winlog/
        linters:
          - gosec
        text: G304

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # The module path is "trans". Without it, gofumpt treats trans/... imports
      # as part of the standard library and joins them into the first import
      # group, while goimports with local-prefixes trans immediately splits them
      # back out — run and fmt then disagree forever about every such file.
      module-path: trans
    goimports:
      local-prefixes:
        - trans
