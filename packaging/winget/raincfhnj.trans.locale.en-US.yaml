ShortDescription: Write prompts in the language you think in and get them translated to English for your coding agent.
Description: |-
  trans is a native Windows translation panel that opens over your terminal
  window. The prompt is written in the language you think in, translated to
  English, and pasted into the window in front — with code in backticks and
  fenced blocks held back from the translation. DeepL, Google, MyMemory and
  any OpenAI-compatible API are supported, and a local command can keep the
  whole draft on your machine.
